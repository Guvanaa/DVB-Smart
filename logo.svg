<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple-like Rounded Background -->
  <rect width="100" height="100" rx="22" fill="#FFCC00"/>

  <!-- Minimalist DVB Elements -->
  <g transform="translate(15, 25)">
    <!-- Heraldic Stripes (Simplified) -->
    <rect x="0" y="5" width="6" height="40" fill="black"/>
    <rect x="10" y="0" width="6" height="45" fill="black"/>
    <rect x="20" y="5" width="6" height="40" fill="black"/>

    <!-- Bold "DVB" Text (Simplified/Stylized) -->
    <text x="32" y="38" font-family="sans-serif" font-weight="900" font-style="italic" font-size="28" fill="black">DVB</text>
  </g>

  <!-- "Smart" Label -->
  <text x="50" y="85" font-family="sans-serif" font-weight="bold" font-size="12" fill="black" text-anchor="middle">SMART</text>
</svg>
