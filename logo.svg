    <rect x="0" y="4" width="8" height="36" rx="4" fill="black"/>
    <rect x="14" y="0" width="8" height="44" rx="4" fill="black"/>
    <rect x="28" y="4" width="8" height="36" rx="4" fill="black"/>
  </g>

  <!-- Clean Geometric Label -->
  <text x="50" y="85" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="10" fill="black" text-anchor="middle" letter-spacing="2">SMART</text>
