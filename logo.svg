<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Centered Minimalist Tram/Bus Silhouette -->
  <g filter="url(#shadow)">
    <!-- Main Body (Top: 288, Bottom: 736, CenterY: 512) -->
    <path d="M400,288 h224 a80,80 0,0 1,80 80 v288 a80,80 0,0 1,-80 80 h-224 a80,80 0,0 1,-80 -80 v-288 a80,80 0,0 1,80 -80 z" fill="black" opacity="0.85" />

    <!-- Windshield -->
    <path d="M400,328 h224 a40,40 0,0 1,40 40 v100 a40,40 0,0 1,-40 40 h-224 a40,40 0,0 1,-40 -40 v-100 a40,40 0,0 1,40 -40 z" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2" stroke-opacity="0.5" />

    <!-- Headlights -->
    <circle cx="420" cy="640" r="24" fill="white" />
    <circle cx="604" cy="640" r="24" fill="white" />

    <!-- Pantograph -->
    <path d="M512 288 L512 224 L456 192 L568 192 L512 224" fill="none" stroke="black" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glass Sheen Overlay -->
  <path d="M0 0 L1024 0 L0 1024 Z" fill="white" fill-opacity="0.1" />
</svg>
