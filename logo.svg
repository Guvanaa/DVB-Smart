<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#mainGrad)" />

  <!-- Stylized dvb -->
  <g filter="url(#shadow)" transform="translate(192, 362)">
    <!-- 'd' -->
    <path d="M110 0 v300 h-110 v-150 a110 110 0 0 1 110 -150 z" fill="black" />
    <!-- 'v' -->
    <path d="M140 100 l70 180 l70 -180 h60 l-100 250 h-60 l-100 -250 z" fill="black" />
    <!-- 'b' -->
    <path d="M530 0 v300 h110 a110 110 0 0 0 0 -220 h-110 v-80 z" fill="black" />
  </g>

  <!-- Glass Sheen -->
  <rect x="0" y="0" width="1024" height="1024" fill="white" fill-opacity="0.05" />
  <path d="M0 0 L1024 0 L0 1024 Z" fill="white" fill-opacity="0.1" />
</svg>
