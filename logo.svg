<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Minimalist Tram/Bus Silhouette (Front View) -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Main Body -->
    <rect x="64" y="128" width="384" height="448" rx="80" fill="black" opacity="0.85" />

    <!-- Windshield -->
    <rect x="104" y="168" width="304" height="180" rx="40" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2" stroke-opacity="0.5" />

    <!-- Headlights -->
    <circle cx="164" cy="480" r="24" fill="white" />
    <circle cx="348" cy="480" r="24" fill="white" />

    <!-- Pantograph (Tram specific) -->
    <path d="M256 128 L256 64 L200 32 L312 32 L256 64" fill="none" stroke="black" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glass Sheen Overlay -->
  <path d="M0 0 L1024 0 L0 1024 Z" fill="white" fill-opacity="0.1" />
</svg>
